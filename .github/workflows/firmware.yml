name: Firmware ESP32

on:
  push:
    tags: ["v*"]
    paths: ["firmware/**", "web/control/**", "tools/embed_web.py", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "web/control/**", "tools/embed_web.py", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Pasang PlatformIO
        run: pip install -U platformio esptool
      - name: Bundel kontroler web ke firmware
        run: python tools/embed_web.py
      - name: Build
        working-directory: firmware
        run: pio run -e esp32dev
      - name: Gabung .bin untuk ESP Web Tools
        working-directory: firmware
        run: PYTHON=python ./merge_bin.sh ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: rzmong-airsuspension-firmware
          path: dist/*.bin
      - name: Lampirkan ke Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
