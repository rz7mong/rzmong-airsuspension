; Build firmware RZMONG Airsuspension dengan PlatformIO (dipakai juga oleh GitHub Actions).
; Sumber tetap di rzmong_airsuspension/rzmong_airsuspension.ino (kompatibel Arduino IDE).
[platformio]
src_dir = rzmong_airsuspension

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; BLE + WiFi + web UI > 1,3 MB → pakai partisi "Huge APP (3MB No OTA)".
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit ADS1X15@^2.5.0
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit GC9A01A@^1.1.0
  bblanchon/ArduinoJson@^7.0.4
  links2004/WebSockets@^2.4.1
